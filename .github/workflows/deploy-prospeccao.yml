name: Deploy prospeccao

# Build web/ + sync leads → FTP /vendas.liganer.com.br/prospeccao/

on:
  push:
    branches: [main]
    paths:
      - 'apps/prospeccao/**'
      - '.github/workflows/deploy-prospeccao.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prospeccao
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/prospeccao
    env:
      LEADS_SYNC_SECRET: ${{ secrets.LEADS_SYNC_SECRET }}
      LEADS_GITHUB_TOKEN: ${{ secrets.LEADS_GITHUB_TOKEN }}
      LEADS_GITHUB_REPO: ${{ secrets.LEADS_GITHUB_REPO || 'igorvroberto/liganer' }}
      LEADS_GITHUB_BRANCH: ${{ secrets.LEADS_GITHUB_BRANCH || 'main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/prospeccao/web/package-lock.json

      - name: Sync leads + build
        run: |
          bash scripts/sync-leads.sh
          cd web
          npm ci
          npm run build
          # Stamp index.html so FTP always reuploads it. After a root-index race
          # overwrote the live index with a stale hash, .ftp-deploy-sync-state.json
          # still matched the good local file and skipped the replace forever.
          python3 -c "
          from pathlib import Path
          p = Path('dist/index.html')
          run = '''${{ github.run_id }}'''
          html = p.read_text(encoding='utf-8')
          stamp = f'<!-- deploy:{run} -->'
          if '<!-- deploy:' in html:
              import re
              html = re.sub(r'<!-- deploy:\\d+ -->', stamp, html, count=1)
          else:
              html = html.replace('</head>', f'  {stamp}\\n  </head>', 1)
          p.write_text(html, encoding='utf-8')
          print('stamped', stamp)
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prospeccao-dist
          path: apps/prospeccao/web/dist
          retention-days: 14

      - name: Write sync API config into dist
        working-directory: apps/prospeccao
        run: |
          if [ -z "$LEADS_SYNC_SECRET" ] || [ -z "$LEADS_GITHUB_TOKEN" ]; then
            echo "::warning::LEADS_SYNC_SECRET / LEADS_GITHUB_TOKEN ausentes — sync automático desligado."
            exit 0
          fi
          mkdir -p web/dist/api
          python3 <<'PY'
          import json, os, pathlib, sys, urllib.error, urllib.request

          secret = os.environ["LEADS_SYNC_SECRET"]
          token = os.environ["LEADS_GITHUB_TOKEN"].strip()
          repo = (os.environ.get("LEADS_GITHUB_REPO") or "igorvroberto/liganer").strip()
          branch = (os.environ.get("LEADS_GITHUB_BRANCH") or "main").strip()

          if "/" not in repo:
              print(f"::error::LEADS_GITHUB_REPO inválido: {repo!r} (use owner/repo)")
              sys.exit(1)

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "liganer-prospeccao-deploy",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as res:
                  meta = json.loads(res.read().decode())
          except urllib.error.HTTPError as e:
              body = e.read().decode(errors="replace")
              print(
                  f"::error::LEADS_GITHUB_TOKEN não acessa {repo} "
                  f"(HTTP {e.code}). Resposta: {body[:300]}"
              )
              sys.exit(1)

          perms = meta.get("permissions") or {}
          if "push" in perms and not perms.get("push"):
              print(f"::error::Token acessa {repo} mas sem push.")
              sys.exit(1)

          print(f"Token OK para {repo} (push={perms.get('push', 'n/a')})")

          cfg = pathlib.Path("web/dist/api/config.local.php")
          cfg.write_text(
              "<?php\nreturn [\n"
              + f"    'sync_secret' => {json.dumps(secret)},\n"
              + f"    'github_token' => {json.dumps(token)},\n"
              + f"    'github_repo' => {json.dumps(repo)},\n"
              + f"    'github_branch' => {json.dumps(branch)},\n"
              + "    'github_csv_path' => 'apps/prospeccao/radar-comercial/LEADS.csv',\n"
              + "];\n",
              encoding="utf-8",
          )

          config_path = pathlib.Path("web/dist/config.json")
          data = {}
          if config_path.is_file():
              data = json.loads(config_path.read_text(encoding="utf-8"))
          data["syncSecret"] = secret
          data["leadsLabel"] = data.get("leadsLabel") or "GitHub → FTP"
          config_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Wrote api/config.local.php and syncSecret in config.json")
          PY

      - name: Check FTP secrets
        id: ftp
        run: |
          if [ -n "${{ secrets.FTP_SERVER }}" ] && [ -n "${{ secrets.FTP_USERNAME }}" ] && [ -n "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets FTP_SERVER / FTP_USERNAME / FTP_PASSWORD ausentes — só gerou artifact."
          fi

      - name: Deploy via FTP/FTPS
        if: steps.ftp.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./apps/prospeccao/web/dist/
          server-dir: /vendas.liganer.com.br/prospeccao/
          dangerous-clean-slate: false
