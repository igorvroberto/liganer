name: Build & deploy prospecção

on:
  push:
    branches: [main]
    paths:
      - 'radar-comercial/**'
      - 'web/**'
      - 'scripts/**'
      - '.github/workflows/deploy-prospeccao.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Sync leads CSV into web public/
        run: bash scripts/sync-leads.sh

      - name: Install & build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: prospeccao-dist
          path: web/dist
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
    steps:
      - name: Download artifact
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' }}
        uses: actions/download-artifact@v4
        with:
          name: prospeccao-dist
          path: dist

      - name: Deploy via rsync/ssh
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' }}
        run: |
          DEST_PATH="${VPS_PATH:-/var/www/vendas.liganer.com.br/prospeccao}"
          DEST_PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEST_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $DEST_PORT -o StrictHostKeyChecking=accept-new" \
            dist/ "$VPS_USER@$VPS_HOST:$DEST_PATH/"

      - name: Skip deploy notice
        if: ${{ env.VPS_HOST == '' || env.VPS_USER == '' || env.VPS_SSH_KEY == '' }}
        run: echo "Secrets VPS_* não configurados — artifact disponível para download manual."
