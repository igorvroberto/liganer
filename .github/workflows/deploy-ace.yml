name: Deploy ACE

on:
  push:
    branches: [main]
    paths:
      - 'apps/ace/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-ace.yml'
  workflow_dispatch:

concurrency:
  group: deploy-orcamento-ace
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ace
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/ace/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare publish folder
        run: |
          mkdir -p dist/api
          cp deploy/api/budgets.php dist/api/budgets.php
          rm -f dist/config.json
          rm -rf dist/data

      - name: Deploy via FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./apps/ace/dist/
          server-dir: /vendas.liganer.com.br/orcamento/ace/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/config.json
            **/data/**
