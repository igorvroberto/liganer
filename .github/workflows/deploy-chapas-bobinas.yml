name: Deploy chapas-bobinas

on:
  push:
    branches: [main]
    paths:
      - 'apps/chapas-bobinas/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-chapas-bobinas.yml'
  workflow_dispatch:

concurrency:
  group: deploy-orcamento-chapas-bobinas
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chapas-bobinas
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/chapas-bobinas/package-lock.json
            packages/shared/package-lock.json

      - name: Install shared
        working-directory: packages/shared
        run: npm ci

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare publish folder
        run: |
          mkdir -p dist/api
          cp "$GITHUB_WORKSPACE/packages/shared/php/budgets.php" dist/api/budgets.php
          if [ -n "${{ secrets.ORCAMENTO_SYNC_SECRET }}" ]; then
            python3 - <<'PY'
          import json
          secret = """${{ secrets.ORCAMENTO_SYNC_SECRET }}""".strip()
          cfg = {
              "saveUrl": "/orcamento/chapas-bobinas/api/budgets.php",
              "printNumberUrl": "",
              "syncSecret": secret,
          }
          with open("dist/config.json", "w", encoding="utf-8") as fh:
              json.dump(cfg, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          print("config.json gerado com ORCAMENTO_SYNC_SECRET")
          PY
          elif [ ! -f dist/config.json ]; then
            echo "AVISO: sem dist/config.json — sync da equipe ficará desligado"
          else
            echo "Usando public/config.json do build"
          fi
          rm -rf dist/data

      - name: Deploy via FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./apps/chapas-bobinas/dist/
          server-dir: /vendas.liganer.com.br/orcamento/chapas-bobinas/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/data/**
