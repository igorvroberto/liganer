name: Sync leads CSV → FTP

# Fonte da verdade: radar-comercial/LEADS.csv no GitHub (privado).
# Qualquer push desse arquivo em main espelha leads.csv na hospedagem.
# O app lê /prospeccao/data/leads.csv (não precisa raw público do GitHub).

on:
  push:
    branches: [main]
    paths:
      - 'radar-comercial/LEADS.csv'
      - '.github/workflows/sync-leads-ftp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftp-leads:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Secrets check
        id: check
        run: |
          if [ -n "$FTP_HOST" ] && [ -n "$FTP_USER" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Configure FTP_HOST, FTP_USER, FTP_PASSWORD (+ opcional FTP_SERVER_DIR)."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Prepare leads.csv for upload
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p ftp-upload
          cp radar-comercial/LEADS.csv ftp-upload/leads.csv
          ls -la ftp-upload

      - name: Upload via FTP
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./ftp-upload/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/prospeccao/data/' }}
          dangerous-clean-slate: false
