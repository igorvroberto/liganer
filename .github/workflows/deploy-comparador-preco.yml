name: Deploy comparador-preco

on:
  push:
    branches: [main]
    paths:
      - 'apps/comparador-preco/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-comparador-preco.yml'
  workflow_dispatch:

concurrency:
  group: deploy-comparador-preco
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/comparador-preco
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/comparador-preco/package-lock.json
            packages/shared/package-lock.json

      - name: Install shared
        working-directory: packages/shared
        run: npm ci

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy via FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./apps/comparador-preco/dist/
          server-dir: /vendas.liganer.com.br/comparador-preco/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
