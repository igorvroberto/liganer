name: Deploy root index to vendas.liganer.com.br

# Publica a home/login/auth da raiz do domínio a partir de apps/root-index/.
# Não reenvia index.html dos SPAs: o script inject baixava o HTML ao vivo e
# republicava via FTP na raiz — em race com o deploy do SPA (ex.: prospecção)
# isso regrava um index antigo apontando para JS já apagado → tela em branco.
# O guard.js já vai embutido no index de cada SPA no build.

on:
  push:
    branches: [main]
    paths:
      - 'apps/root-index/**'
      - '.github/workflows/deploy-root-index.yml'
  workflow_dispatch:

concurrency:
  group: deploy-root-index
  cancel-in-progress: true

jobs:
  deploy-root-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare publish folder
        run: |
          set -euo pipefail
          mkdir -p root-dist/auth root-dist/data
          cp apps/root-index/index.html root-dist/index.html
          cp apps/root-index/login.html root-dist/login.html
          cp apps/root-index/usuarios.html root-dist/usuarios.html
          cp apps/root-index/liganer_favicon.webp root-dist/liganer_favicon.webp
          cp apps/root-index/auth/*.php root-dist/auth/
          cp apps/root-index/auth/guard.js root-dist/auth/guard.js
          cp apps/root-index/data/.htaccess root-dist/data/.htaccess

      - name: Deploy root index via FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./root-dist/
          server-dir: /vendas.liganer.com.br/
          dangerous-clean-slate: false
          # SPA dirs were previously mirrored into root sync state by inject;
          # keep them excluded so this deploy never uploads or deletes them.
          exclude: |
            **/.git*
            **/.git*/**
            **/data/users.json
            **/data/*.json
            **/prospeccao/**
            **/orcamento/**
            **/comparador-preco/**
