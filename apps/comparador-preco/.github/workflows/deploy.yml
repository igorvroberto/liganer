name: Deploy to vendas.liganer.com.br/comparador-preco

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-comparador-preco
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy via FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.liganer.com.br
          username: acesso@liganer.com.br
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /vendas.liganer.com.br/comparador-preco/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
