# Exemplo de site em vendas.liganer.com.br com /prospeccao
# Ajuste paths e certificado conforme a VPS.

server {
    listen 80;
    server_name vendas.liganer.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vendas.liganer.com.br;

    # ssl_certificate     /etc/letsencrypt/live/vendas.liganer.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vendas.liganer.com.br/privkey.pem;

    root /var/www/vendas.liganer.com.br;
    index index.html;

    # Opcional: proteger o CRM comercial
    # auth_basic "Liganer Vendas";
    # auth_basic_user_file /etc/nginx/.htpasswd-vendas;

    location /prospeccao/ {
        alias /var/www/vendas.liganer.com.br/prospeccao/;
        try_files $uri $uri/ /prospeccao/index.html;
    }

    location = /prospeccao {
        return 301 /prospeccao/;
    }
}
