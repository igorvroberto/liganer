name: Deploy prospecção → FTP

# Tudo automático:
# - mudou web/ ou LEADS.csv → build → FTP do site inteiro (/prospeccao)
# - se LEADS_SYNC_* estiverem setados, gera api/config.local.php + syncSecret
# Fonte dos leads: radar-comercial/LEADS.csv (GitHub) → entra no dist/data/leads.csv

on:
  push:
    branches: [main]
    paths:
      - 'radar-comercial/**'
      - 'web/**'
      - 'scripts/**'
      - '.github/workflows/deploy-ftp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      LEADS_SYNC_SECRET: ${{ secrets.LEADS_SYNC_SECRET }}
      LEADS_GITHUB_TOKEN: ${{ secrets.LEADS_GITHUB_TOKEN }}
      LEADS_GITHUB_REPO: ${{ secrets.LEADS_GITHUB_REPO || 'igorvroberto/liganer-prospeccao' }}
      LEADS_GITHUB_BRANCH: ${{ secrets.LEADS_GITHUB_BRANCH || 'main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Sync leads + build
        run: |
          bash scripts/sync-leads.sh
          cd web
          npm ci
          npm run build

      - name: Upload artifact (sempre)
        uses: actions/upload-artifact@v4
        with:
          name: prospeccao-dist
          path: web/dist
          retention-days: 14

      - name: Write sync API config into dist
        run: |
          if [ -z "$LEADS_SYNC_SECRET" ] || [ -z "$LEADS_GITHUB_TOKEN" ]; then
            echo "::warning::LEADS_SYNC_SECRET / LEADS_GITHUB_TOKEN ausentes — sync automático desligado."
            exit 0
          fi
          mkdir -p web/dist/api
          python3 <<'PY'
          import json, os, pathlib, sys, urllib.error, urllib.request

          secret = os.environ["LEADS_SYNC_SECRET"]
          token = os.environ["LEADS_GITHUB_TOKEN"].strip()
          repo = (os.environ.get("LEADS_GITHUB_REPO") or "igorvroberto/liganer-prospeccao").strip()
          branch = (os.environ.get("LEADS_GITHUB_BRANCH") or "main").strip()

          if "/" not in repo:
              print(f"::error::LEADS_GITHUB_REPO inválido: {repo!r} (use owner/repo)")
              sys.exit(1)

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "liganer-prospeccao-deploy",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as res:
                  meta = json.loads(res.read().decode())
          except urllib.error.HTTPError as e:
              body = e.read().decode(errors="replace")
              print(
                  f"::error::LEADS_GITHUB_TOKEN não acessa {repo} "
                  f"(HTTP {e.code}). Crie um PAT classic com escopo repo "
                  f"(ou fine-grained Contents: Read and write neste repo), "
                  f"atualize o secret e rode o deploy de novo. Resposta: {body[:300]}"
              )
              sys.exit(1)

          perms = meta.get("permissions") or {}
          if "push" in perms and not perms.get("push"):
              print(
                  f"::error::Token acessa {repo} mas sem push. "
                  "Ajuste o PAT para Contents: Read and write (ou classic repo)."
              )
              sys.exit(1)

          print(f"Token OK para {repo} (push={perms.get('push', 'n/a')})")

          cfg = pathlib.Path("web/dist/api/config.local.php")
          cfg.write_text(
              "<?php\nreturn [\n"
              + f"    'sync_secret' => {json.dumps(secret)},\n"
              + f"    'github_token' => {json.dumps(token)},\n"
              + f"    'github_repo' => {json.dumps(repo)},\n"
              + f"    'github_branch' => {json.dumps(branch)},\n"
              + "    'github_csv_path' => 'radar-comercial/LEADS.csv',\n"
              + "];\n",
              encoding="utf-8",
          )

          config_path = pathlib.Path("web/dist/config.json")
          data = {}
          if config_path.is_file():
              data = json.loads(config_path.read_text(encoding="utf-8"))
          data["syncSecret"] = secret
          data["leadsLabel"] = data.get("leadsLabel") or "GitHub → FTP"
          config_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Wrote api/config.local.php and syncSecret in config.json")
          PY

      - name: Check FTP secrets
        id: ftp
        run: |
          if [ -n "$FTP_HOST" ] && [ -n "$FTP_USER" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets FTP_HOST / FTP_USER / FTP_PASSWORD ausentes — só gerou artifact."
          fi

      - name: Deploy via FTP
        if: steps.ftp.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./web/dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/prospeccao/' }}
          dangerous-clean-slate: false
