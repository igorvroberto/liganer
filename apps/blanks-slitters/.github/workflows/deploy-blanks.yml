name: Deploy Blanks to HostGator

# Public URL: https://vendas.liganer.com.br/orcamento/blanks-slitters/
# FTP dir secret (FTP_SERVER_DIR): vendas.liganer.com.br/orcamento/blanks-slitters
# Preserva config.json e data/ no host (não usar clean-slate).

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          security: loose
          local-dir: dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}/
          dangerous-clean-slate: false
          exclude: |
            **/config.json
            **/data/**
            **/.git*
            **/node_modules/**
            **/config.example.json
