name: Deploy vendas root index

# Public URL: https://vendas.liganer.com.br/
# Sobe só index.html (+ favicon) na raiz do subdomínio — não apaga orcamento/ nem prospeccao/.
# O deploy da calculadora continua em deploy-blanks.yml → /orcamento/blanks-slitters/

on:
  push:
    branches:
      - main
    paths:
      - "vendas-root/**"
      - ".github/workflows/deploy-vendas-root.yml"
  workflow_dispatch:

jobs:
  deploy-root:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload vendas-root via FTPS (put only)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_SERVER:-}" ] || [ -z "${FTP_USERNAME:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "FTP secrets missing"
            exit 1
          fi

          # FTP_SERVER_DIR tipicamente: vendas.liganer.com.br/orcamento/blanks-slitters
          # Raiz do site: vendas.liganer.com.br
          ROOT_DIR="${FTP_SERVER_DIR%/}"
          ROOT_DIR="${ROOT_DIR%/orcamento/blanks-slitters}"
          ROOT_DIR="${ROOT_DIR%/}"
          if [ -z "$ROOT_DIR" ]; then
            ROOT_DIR="vendas.liganer.com.br"
          fi

          PORT="${FTP_PORT:-21}"
          echo "Uploading to ftp://${FTP_SERVER}:${PORT}/${ROOT_DIR}/ (index.html + favicon only)"

          lftp -c "
            set cmd:fail-exit yes
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate no
            open -u ${FTP_USERNAME},${FTP_PASSWORD} -p ${PORT} ftp://${FTP_SERVER}
            cd ${ROOT_DIR}
            put -O . vendas-root/index.html -o index.html
            put -O . vendas-root/liganer_favicon.webp -o liganer_favicon.webp
            ls index.html liganer_favicon.webp
            bye
          "
